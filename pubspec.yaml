name: decode
description: Decode by Senpai Studio - a free, ad-free mobile coding IDE for Android.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0
  android_intent_plus: ^5.2.0
  archive: ^3.6.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
